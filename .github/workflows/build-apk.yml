name: Build QBook APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org=com.concreteequipmenthire --project-name=qbook .

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze


      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk QBook.apk

      - name: Upload QBook APK
        uses: actions/upload-artifact@v4
        with:
          name: QBook-Android
          path: QBook.apk
          retention-days: 30
