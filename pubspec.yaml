name: ceh
description: CEH company operations mobile app for Concrete Equipment Hire Limited.
publish_to: "none"
version: 0.3.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  package_info_plus: ^8.3.1
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ceh_logo.png
